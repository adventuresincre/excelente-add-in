name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/excel-addin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/excel-addin/package-lock.json

      - run: npm ci

      # tsc is the real correctness gate. Vite's build tolerates type errors
      # that tsc catches, so run this first and separately.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # manifest.xml is generated, so build it before validating it.
      - name: Validate manifest
        run: |
          npm run manifest:dev
          npm run validate
